name: iOS native Liquid Glass
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/ios-native-background-audio', 'codex/ios-native-redesign']
    paths: ['ios/**', 'internal/**', 'core/**', 'go.mod', 'go.sum', '.github/workflows/ios-native.yml']
  pull_request:
    paths: ['ios/**', 'internal/**', 'core/**', 'go.mod', 'go.sum', '.github/workflows/ios-native.yml']
permissions:
  contents: read
concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Show environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 -c 'import subprocess; v=subprocess.check_output(["xcrun","--sdk","iphoneos","--show-sdk-version"],text=True); assert int(v.split(".")[0]) >= 26, "Liquid Glass requires Xcode 26+ SDK"'
          go version
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Verify Go and JavaScript bridge
        run: |
          go test ./internal/spotify ./internal/web ./internal/appshell ./core
          node --test ios/Tests/native-audio.test.cjs
      - name: Build native unsigned IPA
        run: bash ios/scripts/package.sh
      - name: Build Go library for simulator
        run: bash ios/scripts/build-go.sh simulator
      - name: Test native queue in simulator
        timeout-minutes: 10
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,re,sys; d=json.load(sys.stdin); candidates=[(tuple(map(int,re.findall(r"\d+",runtime))),x["name"]=="iPhone 17 Pro Max",x["udid"]) for runtime,devices in d["devices"].items() if "iOS-" in runtime and int(re.search(r"iOS-(\d+)",runtime).group(1))>=26 for x in devices if x["name"].startswith("iPhone")]; assert candidates,"No iOS 26+ iPhone simulator installed"; print(max(candidates)[2])')
          xcrun simctl list devices available | grep "$DEVICE_ID"
          xcodebuild -project ios/MusicDL.xcodeproj -scheme MusicDL -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath ios/build/NativeTests.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 60 CODE_SIGNING_ALLOWED=NO test
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Test native screens and capture appearances
        timeout-minutes: 12
        run: |
          xcodebuild -project ios/MusicDL.xcodeproj -scheme MusicDLVisual -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath ios/build/VisualTests.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 120 CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test
      - name: Export screen attachments
        if: always()
        run: |
          if [ -d ios/build/VisualTests.xcresult ]; then
            xcrun xcresulttool export attachments --path ios/build/VisualTests.xcresult --output-path ios/build/screenshots
          fi
      - name: Upload preview and matching source
        uses: actions/upload-artifact@v4
        with:
          name: music-dl-ios-native-unsigned
          path: |
            music-dl-ios-native-unsigned.ipa
            music-dl-ios-native-unsigned.ipa.sha256
            music-dl-ios-native-source.txt
            music-dl-ios-native-LICENSE.txt
            music-dl-ios-native-ThirdPartyNotices.txt
            music-dl-ios-native-source.zip
            ios/NOTICE.md
            docs/ios-native-audit.md
            docs/ios-native-design.md
            docs/ios-native-feature-matrix.md
            PROJECT_STATUS.md
          retention-days: 30
      - name: Upload native test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-test-report
          path: |
            ios/build/NativeTests.xcresult
            ios/build/VisualTests.xcresult
            ios/build/screenshots
          if-no-files-found: ignore
