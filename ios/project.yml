name: MusicDL
options:
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    ENABLE_BITCODE: NO
    CURRENT_PROJECT_VERSION: 1
    "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": '$(PROJECT_DIR)/build/device'
    "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": '$(PROJECT_DIR)/build/simulator'
targets:
  MusicDL:
    type: application
    platform: iOS
    sources:
      - path: MusicDL
        excludes: [Info.plist, Bridge.h]
      - path: ../LICENSE
        buildPhase: resources
      - path: NOTICE.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guohuiyuan.musicdl.nativepreview
        INFOPLIST_FILE: MusicDL/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: MusicDL/Bridge.h
        OTHER_LDFLAGS: ['$(inherited)', '-lmusicdl', '-lresolv']
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: WebKit.framework
      - sdk: Security.framework
  MusicDLTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: MusicDL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guohuiyuan.musicdl.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MusicDL:
    build:
      targets:
        MusicDL: all
        MusicDLTests: [test]
    test:
      targets: [MusicDLTests]
